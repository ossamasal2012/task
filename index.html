<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير المهام الذكي - مخصص للطباعة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            transition: background-color 0.3s ease;
        }
        .task-completed {
            text-decoration: line-through;
            opacity: 0.6;
        }
        td {
            word-wrap: break-word;
            word-break: break-word;
            white-space: normal !important;
            vertical-align: top;
        }
        
        /* إخفاء عمود الطباعة في الشاشة العادية */
        .print-only-column { display: none; }

        @media print {
            .no-print { display: none !important; }
            .print-only-column { display: table-cell !important; }
            
            body { background-color: white !important; color: black !important; padding: 0; }
            
            /* تمييز عناوين الجدول باللون السماوي والنص الأزرق عند الطباعة */
            thead tr {
                background-color: #f28a8a !important; /* سماوي فاتح */
                -webkit-print-color-adjust: exact;
            }
            th {
                color: #000000 !important; /* أزرق */
                border: 1px solid #000000 !important;
                padding: 12px 8px !important;
            }
            td {
                border: 1px solid #cbd5e1 !important;
                padding: 10px 8px !important;
            }

            /* تصميم مربع الحالة للطباعة */
            .check-box-print {
                width: 20px;
                height: 20px;
                border: 2px solid #1d4ed8;
                margin: 0 auto;
                border-radius: 3px;
            }
        }
    </style>
</head>
<body class="p-2 md:p-6 bg-slate-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">

    <div class="max-w-[98%] mx-auto bg-white dark:bg-slate-800 rounded-xl shadow-lg overflow-hidden border dark:border-slate-700">
        
        <div class="bg-blue-600 dark:bg-indigo-700 p-6 text-white flex justify-between items-center no-print">
            <div>
                <h1 class="text-2xl font-bold">مدير المهام الذكي</h1>
                <p class="text-blue-100 dark:text-indigo-100 text-sm">نظم وقتك وموادك بكفاءة عالية</p>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-lg bg-blue-500 dark:bg-indigo-600 hover:ring-4 hover:ring-blue-300 transition-all">
                    <svg id="theme-toggle-light-icon" class="hidden w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.243 1.757a1 1 0 011.414 0l.707.707a1 1 0 11-1.414 1.414l-.707-.707a1 1 0 010-1.414zM17 10a1 1 0 011-1h1a1 1 0 110 2h-1a1 1 0 01-1-1zM14.243 16.243a1 1 0 010 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0zM10 17a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.757 16.243a1 1 0 01-1.414 0l-.707-.707a1 1 0 011.414-1.414l.707.707a1 1 0 010 1.414zM3 10a1 1 0 011-1h1a1 1 0 110 2H4a1 1 0 01-1-1zM5.757 3.757a1 1 0 010 1.414l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0zM10 5a5 5 0 100 10 5 5 0 000-10z"></path></svg>
                    <svg id="theme-toggle-dark-icon" class="hidden w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                </button>
                <button onclick="window.print()" class="bg-white text-blue-600 px-4 py-2 rounded-lg font-bold hover:bg-blue-50 transition flex items-center gap-2 text-sm shadow">
                    <span>طباعة الجدول</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="p-6 border-b dark:border-slate-700 no-print">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <input type="text" id="subject" placeholder="المادة" class="w-full p-2 border dark:border-slate-600 dark:bg-slate-700 rounded-lg outline-none">
                <input type="text" id="description" placeholder="الوصف" class="w-full p-2 border dark:border-slate-600 dark:bg-slate-700 rounded-lg outline-none">
                <input type="datetime-local" id="startDate" class="w-full p-2 border dark:border-slate-600 dark:bg-slate-700 rounded-lg text-sm">
                <input type="datetime-local" id="endDate" class="w-full p-2 border dark:border-slate-600 dark:bg-slate-700 rounded-lg text-sm">
                <button onclick="addTask()" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold hover:bg-green-700 transition">إضافة المهمة</button>
            </div>
        </div>

        <div class="p-6 overflow-x-auto">
            <table class="w-full text-right border-collapse" id="mainTable">
                <thead>
                    <tr class="bg-gray-100 dark:bg-slate-700">
                        <th class="p-4 border dark:border-slate-600 print-only-column w-16 text-center">الحالة</th>
                        <th class="p-4 border dark:border-slate-600 w-32">المادة</th>
                        <th class="p-4 border dark:border-slate-600">الوصف</th>
                        <th class="p-4 border dark:border-slate-600 w-40 text-center">البدء</th>
                        <th class="p-4 border dark:border-slate-600 w-40 text-center">الانتهاء</th>
                        <th class="p-4 border dark:border-slate-600 no-print w-48 text-center">الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="taskList"></tbody>
            </table>
            <div id="emptyState" class="text-center py-10 text-gray-500">لا توجد مهام حالياً.</div>
        </div>
    </div>

    <div id="editModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl w-full max-w-md mx-4 shadow-2xl">
            <h2 class="text-xl font-bold mb-4">تعديل المهمة</h2>
            <div class="space-y-4">
                <input type="text" id="editSubject" class="w-full p-2 border dark:border-slate-600 dark:bg-slate-700 rounded">
                <textarea id="editDescription" class="w-full p-2 border dark:border-slate-600 dark:bg-slate-700 rounded h-32"></textarea>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs">تاريخ البدء</label>
                        <input type="datetime-local" id="editStart" class="w-full p-2 border dark:border-slate-600 dark:bg-slate-700 rounded">
                    </div>
                    <div>
                        <label class="text-xs">تاريخ الانتهاء</label>
                        <input type="datetime-local" id="editEnd" class="w-full p-2 border dark:border-slate-600 dark:bg-slate-700 rounded">
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="saveEdit()" class="bg-blue-600 text-white px-4 py-2 rounded flex-1">حفظ</button>
                    <button onclick="closeEditModal()" class="bg-gray-400 text-white px-4 py-2 rounded flex-1">إلغاء</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('my_tasks_data')) || [];
        let editingId = null;

        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('color-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            updateThemeIcons();
        }

        function updateThemeIcons() {
            if (document.documentElement.classList.contains('dark')) {
                lightIcon.classList.remove('hidden'); darkIcon.classList.add('hidden');
            } else {
                lightIcon.classList.add('hidden'); darkIcon.classList.remove('hidden');
            }
        }

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        updateThemeIcons();

        function addTask() {
            const subject = document.getElementById('subject').value;
            const description = document.getElementById('description').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            if (!subject || !description || !startDate || !endDate) {
                alert('يرجى ملء جميع الحقول'); return;
            }

            tasks.push({ id: Date.now(), subject, description, startDate, endDate, completed: false });
            saveAndRender();
            ['subject', 'description', 'startDate', 'endDate'].forEach(id => document.getElementById(id).value = '');
        }

        function saveAndRender() {
            localStorage.setItem('my_tasks_data', JSON.stringify(tasks));
            renderTasks();
        }

        function toggleComplete(id) {
            tasks = tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t);
            saveAndRender();
        }

        function deleteTask(id) {
            if(confirm('هل تريد حذف هذه المهمة؟')) {
                tasks = tasks.filter(t => t.id !== id);
                saveAndRender();
            }
        }

        function openEditModal(id) {
            const t = tasks.find(task => task.id === id);
            editingId = id;
            document.getElementById('editSubject').value = t.subject;
            document.getElementById('editDescription').value = t.description;
            document.getElementById('editStart').value = t.startDate;
            document.getElementById('editEnd').value = t.endDate;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

        function saveEdit() {
            tasks = tasks.map(t => t.id === editingId ? {
                ...t,
                subject: document.getElementById('editSubject').value,
                description: document.getElementById('editDescription').value,
                startDate: document.getElementById('editStart').value,
                endDate: document.getElementById('editEnd').value
            } : t);
            closeEditModal(); saveAndRender();
        }

        function formatDateTime(str) {
            if(!str) return "-";
            return new Date(str).toLocaleString('ar-EG', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            document.getElementById('emptyState').classList.toggle('hidden', tasks.length > 0);
            list.innerHTML = '';

            tasks.forEach(task => {
                const tr = document.createElement('tr');
                tr.className = `border-b dark:border-slate-700 transition ${task.completed ? 'task-completed bg-gray-50 dark:bg-slate-800/50' : ''}`;
                tr.innerHTML = `
                    <td class="p-4 border-l border-gray-200 print-only-column text-center">
                        <div class="check-box-print"></div>
                    </td>
                    <td class="p-4 font-bold text-blue-600 dark:text-blue-400">${task.subject}</td>
                    <td class="p-4 text-sm leading-relaxed">${task.description}</td>
                    <td class="p-4 text-center text-xs font-medium">${formatDateTime(task.startDate)}</td>
                    <td class="p-4 text-center text-xs text-red-500 font-medium">${formatDateTime(task.endDate)}</td>
                    <td class="p-4 no-print">
                        <div class="flex flex-wrap justify-center gap-2 items-start">
                            <button onclick="toggleComplete(${task.id})" class="${task.completed ? 'bg-orange-500' : 'bg-blue-500'} text-white px-3 py-1 rounded text-xs hover:opacity-80">
                                ${task.completed ? 'تراجع' : 'إكمال'}
                            </button>
                            <button onclick="openEditModal(${task.id})" class="bg-gray-500 text-white px-3 py-1 rounded text-xs hover:opacity-80">تعديل</button>
                            <button onclick="deleteTask(${task.id})" class="bg-red-500 text-white px-3 py-1 rounded text-xs hover:opacity-80">حذف</button>
                        </div>
                    </td>
                `;
                list.appendChild(tr);
            });
        }

        window.onload = renderTasks;
    </script>
</body>
</html>
